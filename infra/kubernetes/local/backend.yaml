apiVersion: apps/v1
kind: Deployment
metadata:
  name: supplai-backend
  namespace: supplai
  labels:
    app: supplai-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supplai-backend
  template:
    metadata:
      labels:
        app: supplai-backend
    spec:
      containers:
        - name: supplai-backend
          image: supplai-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: development
            - name: HEALTH_PORT
              value: "3001"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: supplai-backend
  namespace: supplai
spec:
  type: ClusterIP
  selector:
    app: supplai-backend
  ports:
    - name: health
      port: 3001
      targetPort: health
