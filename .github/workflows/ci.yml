name: CI
on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    name: Deploy to AWS ECS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production-ecs-deploy
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "439777529311"
      ECS_CLUSTER: supplai-production
      FRONTEND_SERVICE: supplai-frontend
      BACKEND_SERVICE: supplai-backend
      IMAGE_TAG: git-${{ github.sha }}
      AUTH_EMAIL_FROM: Supplai <no-reply@supplai-pilot.com>

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Detect deployable changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.before }}"
          if [[ "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-list --max-parents=0 HEAD)"
          fi

          frontend_changed=false
          backend_changed=false
          database_changed=false
          if ! git cat-file -e "$base_sha^{commit}"; then
            echo "Base commit $base_sha is unavailable; refusing to skip deployment."
            exit 1
          fi
          changed_files="$(git diff --name-only "$base_sha" "$GITHUB_SHA")"
          while IFS= read -r file; do
            case "$file" in
              frontend/*|frontend/Dockerfile|backend/aws/frontend-task-definition.json)
                frontend_changed=true
                ;;
              backend/*|backend/Dockerfile|backend/aws/ecs-task-definition.json)
                backend_changed=true
                ;;
              packages/*|package.json|pnpm-lock.yaml)
                frontend_changed=true
                backend_changed=true
                ;;
              .github/workflows/ci.yml|backend/aws/github-actions-deploy-policy.json)
                frontend_changed=true
                backend_changed=true
                database_changed=true
                ;;
            esac
            case "$file" in
              packages/database/prisma/migrations/*|packages/database/prisma/schema.prisma|backend/aws/migration-task-definition.json|backend/aws/migrations.Dockerfile)
                database_changed=true
                ;;
            esac
          done <<< "$changed_files"

          echo "frontend=$frontend_changed" >> "$GITHUB_OUTPUT"
          echo "backend=$backend_changed" >> "$GITHUB_OUTPUT"
          echo "database=$database_changed" >> "$GITHUB_OUTPUT"
          echo "Frontend changed: $frontend_changed"
          echo "Backend changed: $backend_changed"
          echo "Database changed: $database_changed"

      - name: Build and push frontend image
        if: steps.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/supplai-frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push backend image
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/supplai-backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push migration image
        if: steps.changes.outputs.database == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/aws/migrations.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/supplai-migrations:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=migrations
          cache-to: type=gha,mode=max,scope=migrations

      - name: Look up production secret ARNs
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true' || steps.changes.outputs.database == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "DATABASE_URL_SECRET_ARN=$(aws secretsmanager describe-secret --secret-id supplai/production/database-url --query ARN --output text)" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_SECRET_ARN=$(aws secretsmanager describe-secret --secret-id supplai/production/better-auth-secret --query ARN --output text)" >> "$GITHUB_ENV"
          echo "RESEND_API_KEY_ARN=$(aws secretsmanager describe-secret --secret-id supplai/production/resend-api-key --query ARN --output text)" >> "$GITHUB_ENV"
          echo "GEMINI_API_KEY_ARN=$(aws secretsmanager describe-secret --secret-id supplai/production/gemini-api-key --query ARN --output text)" >> "$GITHUB_ENV"

      - name: Render and register frontend task definition
        if: steps.changes.outputs.frontend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sed \
            -e "s|<AWS_ACCOUNT_ID>|$AWS_ACCOUNT_ID|g" \
            -e "s|<AWS_REGION>|$AWS_REGION|g" \
            -e "s|<IMAGE_TAG>|$IMAGE_TAG|g" \
            -e "s|<DATABASE_URL_SECRET_ARN>|$DATABASE_URL_SECRET_ARN|g" \
            -e "s|<BETTER_AUTH_SECRET_ARN>|$BETTER_AUTH_SECRET_ARN|g" \
            -e "s|<RESEND_API_KEY_ARN>|$RESEND_API_KEY_ARN|g" \
            -e "s|<GEMINI_API_KEY_ARN>|$GEMINI_API_KEY_ARN|g" \
            -e "s|http://REPLACE_WITH_LOAD_BALANCER_URL|https://supplai-pilot.com|g" \
            -e "s|REPLACE_WITH_AUTH_EMAIL_FROM|$AUTH_EMAIL_FROM|g" \
            backend/aws/frontend-task-definition.json \
            > "$RUNNER_TEMP/frontend-task-definition.json"
          ! grep -Eq '<[^>]+>|REPLACE_WITH' "$RUNNER_TEMP/frontend-task-definition.json"
          aws ecs register-task-definition \
            --cli-input-json "file://$RUNNER_TEMP/frontend-task-definition.json" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text > "$RUNNER_TEMP/frontend-task-definition-arn"

      - name: Render and register backend task definition
        if: steps.changes.outputs.backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sed \
            -e "s|<AWS_ACCOUNT_ID>|$AWS_ACCOUNT_ID|g" \
            -e "s|<AWS_REGION>|$AWS_REGION|g" \
            -e "s|<IMAGE_TAG>|$IMAGE_TAG|g" \
            backend/aws/ecs-task-definition.json \
            > "$RUNNER_TEMP/backend-task-definition.json"
          ! grep -Eq '<[^>]+>|REPLACE_WITH' "$RUNNER_TEMP/backend-task-definition.json"
          aws ecs register-task-definition \
            --cli-input-json "file://$RUNNER_TEMP/backend-task-definition.json" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text > "$RUNNER_TEMP/backend-task-definition-arn"

      - name: Render and register migration task definition
        if: steps.changes.outputs.database == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sed \
            -e "s|<AWS_ACCOUNT_ID>|$AWS_ACCOUNT_ID|g" \
            -e "s|<AWS_REGION>|$AWS_REGION|g" \
            -e "s|<IMAGE_TAG>|$IMAGE_TAG|g" \
            -e "s|<DATABASE_URL_SECRET_ARN>|$DATABASE_URL_SECRET_ARN|g" \
            backend/aws/migration-task-definition.json \
            > "$RUNNER_TEMP/migration-task-definition.json"
          ! grep -Eq '<[^>]+>|REPLACE_WITH' "$RUNNER_TEMP/migration-task-definition.json"
          aws ecs register-task-definition \
            --cli-input-json "file://$RUNNER_TEMP/migration-task-definition.json" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text > "$RUNNER_TEMP/migration-task-definition-arn"

      - name: Apply database migrations
        if: steps.changes.outputs.database == 'true'
        shell: bash
        run: |
          set -euo pipefail
          network_configuration="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$FRONTEND_SERVICE" \
            --query 'services[0].networkConfiguration' \
            --output json)"
          run_result="$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --platform-version LATEST \
            --network-configuration "$network_configuration" \
            --task-definition "$(<"$RUNNER_TEMP/migration-task-definition-arn")")"
          if [[ "$(jq '.failures | length' <<< "$run_result")" != "0" ]]; then
            jq '.failures' <<< "$run_result"
            exit 1
          fi
          migration_task_arn="$(jq -r '.tasks[0].taskArn // empty' <<< "$run_result")"
          if [[ -z "$migration_task_arn" ]]; then
            echo "ECS did not return a migration task ARN."
            exit 1
          fi
          aws ecs wait tasks-stopped \
            --cluster "$ECS_CLUSTER" \
            --tasks "$migration_task_arn"
          migration_result="$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$migration_task_arn")"
          exit_code="$(jq -r '.tasks[0].containers[] | select(.name == "migration") | .exitCode // empty' <<< "$migration_result")"
          if [[ "$exit_code" != "0" ]]; then
            jq '{stoppedReason: .tasks[0].stoppedReason, containers: [.tasks[0].containers[] | {name, exitCode, reason}]}' <<< "$migration_result"
            exit 1
          fi

      - name: Deploy frontend service
        if: steps.changes.outputs.frontend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$FRONTEND_SERVICE" \
            --task-definition "$(<"$RUNNER_TEMP/frontend-task-definition-arn")" \
            --force-new-deployment

      - name: Deploy backend service
        if: steps.changes.outputs.backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$BACKEND_SERVICE" \
            --task-definition "$(<"$RUNNER_TEMP/backend-task-definition-arn")" \
            --force-new-deployment

      - name: Wait for ECS services to become stable
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true'
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$FRONTEND_SERVICE" "$BACKEND_SERVICE"
